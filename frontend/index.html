<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bloom — A space for your ideas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <symbol id="spark" viewBox="0 0 24 24">
                <path d="M12 2c0 7-3 10-10 10 7 0 10 3 10 10 0-7 3-10 10-10-7 0-10-3-10-10Z" />
            </symbol>
            <symbol id="compose" viewBox="0 0 24 24">
                <path d="M13 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 3l5 5M10 14l1-5 8-8 5 5-8 8Z" />
            </symbol>
            <symbol id="chat" viewBox="0 0 24 24">
                <path d="M21 11a9 9 0 0 1-9 9H4l-3 2 2-7a9 9 0 1 1 18-4Z" />
            </symbol>
            <symbol id="arrow" viewBox="0 0 24 24">
                <path d="M12 19V5m-6 6 6-6 6 6" />
            </symbol>
            <symbol id="mic" viewBox="0 0 24 24">
                <rect x="9" y="2" width="6" height="13" rx="3" />
                <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8" />
            </symbol>
            <symbol id="globe" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <ellipse cx="12" cy="12" rx="4" ry="9" />
                <path d="M3 12h18" />
            </symbol>
            <symbol id="bulb" viewBox="0 0 24 24">
                <path d="M9 18v-2a7 7 0 1 1 6 0v2M9 21h6M9 18h6" />
            </symbol>
            <symbol id="chevron" viewBox="0 0 24 24">
                <path d="m9 5 7 7-7 7" />
            </symbol>
            <symbol id="down" viewBox="0 0 24 24">
                <path d="m6 9 6 6 6-6" />
            </symbol>
            <symbol id="menu" viewBox="0 0 24 24">
                <path d="M4 6h16M4 12h16M4 18h16" />
            </symbol>
            <symbol id="close" viewBox="0 0 24 24">
                <path d="m6 6 12 12M18 6 6 18" />
            </symbol>
            <symbol id="stop" viewBox="0 0 24 24">
                <rect x="6" y="6" width="12" height="12" rx="2" />
            </symbol>
            <symbol id="copy" viewBox="0 0 24 24">
                <rect x="8" y="8" width="13" height="13" rx="3" />
                <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
            </symbol>
            <symbol id="like" viewBox="0 0 24 24">
                <path d="M7 10h-4v11h4V10Zm0 0 5-8c3 0 3 3 2 7h5a2 2 0 0 1 2 3l-2 7a3 3 0 0 1-3 2H7" />
            </symbol>
            <symbol id="sound" viewBox="0 0 24 24">
                <path d="m11 4-6 5H2v6h3l6 5V4Zm4 4a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
            </symbol>
            <symbol id="refresh" viewBox="0 0 24 24">
                <path d="M20 8a9 9 0 1 0 1 8M20 3v6h-6" />
            </symbol>
            <symbol id="check" viewBox="0 0 24 24">
                <path d="m5 12 4 4L19 6" />
            </symbol>
            <symbol id="thinking" viewBox="0 0 24 24">
                <circle cx="5" cy="12" r="2" fill="currentColor">
                    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"
                        begin="0s" />
                </circle>
                <circle cx="12" cy="12" r="2" fill="currentColor">
                    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"
                        begin="0.2s" />
                </circle>
                <circle cx="19" cy="12" r="2" fill="currentColor">
                    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"
                        begin="0.4s" />
                </circle>
            </symbol>
        </defs>
    </svg>
    <div class="app" style="justify-content: center;">
        <main style="width: 85%;margin: 2%;">
            <div class="main-body" id="main-body" style="width: 100%;">
                <section class="messages"></section>
                <div class="input-area">
                    <div class="composer">
                        <div class="text-input-row" id="text-input-row">
                            <textarea id="message-input" placeholder="Ask anything, or think out loud…" rows="1"
                                oninput="userWriting()" style="height: 38px;"></textarea>
                        </div>
                        <div class="composer-bottom">
                            <button type="button" class="thinking-mode" id="thinking-mode" aria-pressed="false">
                                <svg>
                                    <use href="#spark"></use>
                                </svg>Think deeper
                            </button>
                            <div class="send-controls">
                                <span class="enter-hint">Let's make something of it</span>
                                <button class="send-button" type="submit" onclick="sendChat()" disabled>
                                    <svg>
                                        <use href="#arrow"></use>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <p class="status-message" id="status-message" role="status"></p>
                    <div class="suggestions">
                        <button class="suggestion"
                            data-prompt="Help me brainstorm a fresh idea for a creative project.">
                            <span class="suggestion-icon idea">
                                <svg>
                                    <use href="#bulb"></use>
                                </svg>
                            </span>
                            <span>
                                <strong>Find a little inspiration</strong>
                                <small>Give your next idea
                                    a head start
                                </small>
                            </span>
                            <svg class="suggestion-arrow">
                                <use href="#chevron"></use>
                            </svg>
                        </button>
                        <button class="suggestion" data-prompt="Help me write a thoughtful message.">
                            <span class="suggestion-icon write">
                                <svg>
                                    <use href="#compose"></use>
                                </svg>
                            </span>
                            <span>
                                <strong>Put it into words</strong>
                                <small>Find the right words for
                                    anything
                                </small>
                            </span>
                            <svg class="suggestion-arrow">
                                <use href="#chevron"></use>
                            </svg>
                        </button>
                        <button class="suggestion" data-prompt="Explain something interesting about the world.">
                            <span class="suggestion-icon explore">
                                <svg>
                                    <use href="#globe"></use>
                                </svg>
                            </span>
                            <span>
                                <strong>Follow your curiosity</strong>
                                <small>Go a little deeper into
                                    a topic</small>
                            </span>
                            <svg class="suggestion-arrow">
                                <use href="#chevron"></use>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>


    <script src="./assets/js/script.js"></script>

</body>

</html>
